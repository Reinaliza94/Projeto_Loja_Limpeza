<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<title>Cadastro de Pedido</title>

<style>

body{
    margin:0;
    background-color:antiquewhite;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    display:flex;
}

/* MENU */

.menu{
    background-color:#2c3e50;
    width:220px;
    height:100vh;
    padding:20px;
}

.menu h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
}

.menu a{
    text-decoration:none;
}

.menu button{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background-color:rgb(127,188,199);
}

.menu button:hover{
    background-color:grey;
    color:white;
}

.sair button{
    background-color:red;
    color:white;
}

/* SUBMENU CLIENTES */

.dropdown{
    position:relative;
    width:100%;
}

.dropbtn{
    width:100%;
}

.dropdown-content{
    display:none;
    background-color:#34495e;
    border-radius:5px;
    overflow:hidden;
}

.dropdown-content a{
    display:block;
    color:white;
    padding:10px;
    text-decoration:none;
    font-size:14px;
}

.dropdown-content a:hover{
    background-color:grey;
}

.dropdown:hover .dropdown-content{
    display:block;
}

/* CONTEÚDO */

.conteudo{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.cadastro{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background-color:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    width:250px;
    height:30px;
    border-radius:5px;
    border:1px solid gray;
    padding-left:10px;
}

.botao{
    background-color:rgb(127,188,199);
    border:none;
    border-radius:5px;
    padding:10px 20px;
    cursor:pointer;
}

.botao:hover{
    background-color:grey;
    color:white;
}

</style>

</head>

<body>

<div class="container">

    <div class="menu">

    <h2>MENU</h2>

    <!-- CLIENTES -->

    <div class="dropdown">

        <button class="dropbtn">Clientes ▼</button>

        <div class="dropdown-content">
            <a href="cadastro_cliente.html">
                Cadastrar Cliente
            </a>

            <a href="clientes_cadastrados.html">
                Clientes Cadastrados
            </a>
        </div>

    </div>

    <!-- PRODUTOS -->

    <div class="dropdown">

        <button class="dropbtn">Produtos ▼</button>

        <div class="dropdown-content">
            <a href="cadastro_de_produto.html">
                Cadastrar Produto
            </a>

            <a href="produtos_cadastrados.html">
                Produtos Cadastrados
            </a>
        </div>

    </div>

    <!-- PEDIDOS -->

    <div class="dropdown">

        <button class="dropbtn">Pedidos ▼</button>

        <div class="dropdown-content">
            <a href="cadastro_pedido.html">
                Cadastrar Pedido
            </a>

            <a href="pedidos_cadastrados.html">
                Pedidos Cadastrados
            </a>
        </div>

    </div>

    <!-- SAIR -->

    <div class="sair">
    <a href="tela_login.html">
        <button>Sair</button>
    </a>
</div>

</div> <!-- fecha menu -->

    <div class="conteudo">
        <div class="cadastro">

            <h2>Cadastro de Pedido</h2>

            <label>Cliente</label>
            <input type="text">

            <label>Produto</label>
            <input type="text">

            <label>Quantidade</label>
            <input type="number" step="0.01">

<button type="button"
        class="botao"
        onclick="alert('Pedido cadastrado com sucesso!')">
    Registrar Pedido
</button>

</div> <!-- fecha conteudo -->

    </div> <!-- fecha container -->


</body>
</html>
