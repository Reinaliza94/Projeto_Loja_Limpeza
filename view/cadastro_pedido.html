<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<title>Cadastro de Pedido</title>

<style>

body{
    margin:0;
    background-color:antiquewhite;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    display:flex;
}

.menu{
    width:220px;
    height:100vh;
    background:#2c3e50;
    padding:20px;
}

.menu h2{
    color:white;
    text-align:center;
}

.conteudo{
    flex:1;
    text-align:center;
    padding:30px;
}
.menu{
    background-color:#2c3e50;
    width:220px;
    height:100vh;
    padding:20px;
}

.menu h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
}

.menu a{
    text-decoration:none;
}

.menu button{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background-color:rgb(127,188,199);
}

.menu button:hover{
    background-color:grey;
    color:white;
}

.sair button{
    background-color:red;
    color:white;
}

/* Submenu Clientes */

.dropdown{
    position:relative;
    width:100%;
}

.dropbtn{
    width:100%;
}

.dropdown-content{
    display:none;
    background-color:#34495e;
    border-radius:5px;
    overflow:hidden;
}

.dropdown-content a{
    display:block;
    color:white;
    padding:10px;
    text-decoration:none;
}

.dropdown-content a:hover{
    background-color:grey;
}

.dropdown:hover .dropdown-content{
    display:block;
}

</style>

</head>

<body>

<div class="container">

<div class="menu">

<h2>MENU</h2>

<a href="tela_login.html"><button>Sair</button></a>

</div>

<div class="conteudo">

<h2>Cadastro de Pedido</h2>

<label>Cliente</label><br>
<input type="text"><br><br>

<label>Produto</label><br>
<input type="text"><br><br>

<label>Quantidade</label><br>

<button>Registrar Pedido</button>

</div>

</div>
