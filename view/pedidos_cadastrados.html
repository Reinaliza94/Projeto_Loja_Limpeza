<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<title>Pedidos Cadastrados</title>

<style>

body{
    margin:0;
    background-color:antiquewhite;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    display:flex;
}

/* MENU */

.menu{
    background-color:#2c3e50;
    width:220px;
    height:100vh;
    padding:20px;
}

.menu h2{
    color:white;
    text-align:center;
}

.menu a{
    text-decoration:none;
}

.menu button{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background-color:rgb(127,188,199);
}

.menu button:hover{
    background-color:grey;
    color:white;
}

.sair button{
    background-color:red;
    color:white;
}

/* SUBMENUS */

.dropdown{
    width:100%;
}

.dropdown-content{
    display:none;
    background-color:#34495e;
    border-radius:5px;
    overflow:hidden;
}

.dropdown-content a{
    display:block;
    color:white;
    padding:10px;
}

.dropdown-content a:hover{
    background-color:grey;
}

.dropdown:hover .dropdown-content{
    display:block;
}

/* CONTEÚDO */

.conteudo{
    flex:1;
    padding:30px;
}

h2{
    text-align:center;
}

table{
    width:80%;
    margin:auto;
    border-collapse:collapse;
    background-color:white;
}

th,td{
    border:1px solid black;
    padding:10px;
    text-align:center;
}

th{
    background-color:#dcdcdc;
}

</style>

</head>

<body>

<div class="container">

    <!-- MENU -->
    <div class="menu">

        <h2>MENU</h2>

        <!-- CLIENTES -->
        <div class="dropdown">
            <button>Clientes ▼</button>

            <div class="dropdown-content">
                <a href="cadastro_cliente.html">Cadastrar Cliente</a>
                <a href="clientes_cadastrados.html">Clientes Cadastrados</a>
            </div>
        </div>

        <!-- PRODUTOS -->
        <div class="dropdown">
            <button>Produtos ▼</button>

            <div class="dropdown-content">
                <a href="cadastro_de_produto.html">Cadastrar Produto</a>
                <a href="produtos_cadastrados.html">Produtos Cadastrados</a>
            </div>
        </div>

        <!-- PEDIDOS -->
        <div class="dropdown">
            <button>Pedidos ▼</button>

            <div class="dropdown-content">
                <a href="cadastro_pedido.html">Cadastrar Pedido</a>
                <a href="pedidos_realizados.html">Pedidos Realizados</a>
            </div>
        </div>

        <!-- SAIR -->
        <div class="sair">
            <a href="tela_login.html">
                <button>Sair</button>
            </a>
        </div>

    </div>

    <!-- CONTEÚDO -->
    <div class="conteudo">

        <h2>Pedidos Cadastrados</h2>

        <table>

            <tr>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Quantidade</th>
            </tr>

            <tr>
                <td>Maria</td>
                <td>Detergente</td>
                <td>5</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
