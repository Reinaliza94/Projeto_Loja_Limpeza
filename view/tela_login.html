<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{
    background-color: antiquewhite;
    text-align:center;
    padding-top:50px;
    font-family:Arial, Helvetica, sans-serif;
}

.login-container{
    width:300px;
    margin:auto;
}

.mb-3{
    display:flex;
    flex-direction:column;
    margin:20px 0;
}

input{
    height:30px;
    border-radius:5px;
    border:1px solid gray;
    padding-left:10px;
}

button{
    background-color:rgb(127,188,199);
    border:none;
    border-radius:5px;
    padding:10px 20px;
    cursor:pointer;
}

button:hover{
    background-color:grey;
    color:white;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-container">
 <img src="../imagem/logo.png" alt="Logo" class="mb-4" style="max-width: 150px;"><br>

<h2>Seja Bem-vindo!</h2>

<div class="mb-3">
<label>Nome</label>
<input type="text">
</div>

<div class="mb-3">
<label>Senha</label>
<input type="password">
</div>

<a href="tela_principal.html">
<button>Entrar</button>
</a>

</div>

</body>
</html>
